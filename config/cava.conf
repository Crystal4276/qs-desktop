; Visualiseur de la barre (services/Cava.qml) : réglages du module `cava` de Waybar 0.15 (INVENTORY.md § 1),
; traduits dans le format de cava 1.0. Waybar passe certaines valeurs directement à libcava, après la
; conversion que fait le fichier de config : sensitivity 2 → 200 (%), noise_reduction 0.77 → 77.

[general]
framerate = 100
autosens = 1
sensitivity = 200
bars = 12
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pulse
source = auto

[output]
method = raw
channels = stereo
mono_option = average
reverse = 0
raw_target = /dev/stdout
data_format = ascii
; 8 niveaux : ▁ … █ (Theme.icon.cavaBars)
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
monstercat = 1
waves = 1
noise_reduction = 77
