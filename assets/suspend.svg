    <linearGradient id="g" x1="30" y1="6" x2="30" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#94e2d5"/>
      <stop offset="1" stop-color="#74c7ec"/>
    </linearGradient>
  </defs>
  <path d="M 28.20 10.08 A 21 21 0 1 0 50.69 34.61 A 17 17 0 0 1 28.20 10.08 Z" stroke="url(#g)" stroke-width="5.5" stroke-linejoin="round"/>
