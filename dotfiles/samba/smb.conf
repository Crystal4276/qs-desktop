# Samba : partages utilisateur (clic droit « Partager » dans Nemo, nemo-share) pour échanger des fichiers avec les VM,
# et dossier personnel (\\<machine>\<utilisateur>) après `smbpasswd -a <utilisateur>`.
# Installé dans /etc/samba/smb.conf par scripts/system-setup.sh (ancien fichier sauvegardé).

[global]
   workgroup = MYGROUP
   server string = Samba Server
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 50
   dns proxy = no
   # Partages créés par les utilisateurs du groupe sambashare (dossier créé par system-setup.sh)
   usershare path = /var/lib/samba/usershares
   usershare max shares = 100
   # Accès limité à cette machine et au réseau des VM de libvirt (« default », 192.168.122.0/24) : rien depuis un autre
   # réseau (Wi-Fi public d'un laptop), même avec le mot de passe
   hosts allow = 127.0.0.1 192.168.122.0/24
   # Pas d'accès invité : partages lus avec le compte (smbpasswd), même sur un Wi-Fi public (laptop)
   usershare allow guests = no
   map to guest = never
   usershare owner only = yes

[homes]
   comment = Home Directories
   browseable = no
   writable = yes
