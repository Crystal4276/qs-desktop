# terrier : écoute aussi sur le réseau local filaire (bridge0 ; casque VR, appareils du LAN).
# Compte Samba obligatoire, pas d'invité (smb.conf).
interfaces = "lo;options=dynamic" "virbr*;options=dynamic" "zt*;options=dynamic" "bridge0;options=dynamic"

# Disques de données (/mnt/*, fstab) en un seul partage : smb://<IP ZeroTier de terrier>/mnt, compte Samba de l'utilisateur.
[mnt]
   comment = Disques de données
   path = /mnt
   writable = yes
   valid users = @sambashare
