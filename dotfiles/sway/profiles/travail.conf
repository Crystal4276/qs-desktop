# Profil « travail » (inclus par ../config d'après scripts/profile.sh) : DigitalMicrograph sur l'espace 9, l'espace 7 libre.
# Mêmes règles que dotfiles/hypr/profiles/travail.lua. Pas de démarrage automatique.

# DigitalMicrograph (Wine, dépôt GMSFreeAnalysis17) : classe « digitalmicrograph.exe » sous XWayland (StartupWMClass du lanceur) ;
# app_id du même nom, casse possiblement différente, avec le pilote Wayland de Wine.
    assign [class="(?i)^digitalmicrograph\.exe$"] 9
    assign [app_id="(?i)^digitalmicrograph\.exe$"] 9
