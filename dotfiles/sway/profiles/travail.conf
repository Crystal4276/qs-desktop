# Profil « travail » (inclus par ../config d'après scripts/profile.sh) : DigitalMicrograph sur 5, Windows sur 6,
# Thunderbird sur 7, Discord-WhatsApp sur 8, Spotify sur 9. Mêmes règles que dotfiles/hypr/profiles/travail.lua. Pas de démarrage automatique.

# Espaces de Discord-WhatsApp, Spotify et Thunderbird (../config), Windows (règles machine).
    set $ws_chat 8
    set $ws_music 9
    set $ws_mail 7
    set $ws_windows 6

# DigitalMicrograph (Wine, dépôt GMSFreeAnalysis17), relevé sur la VM : app_id « digitalmicrograph.exe » avec le pilote Wayland
# de Wine (défaut), classe X11 du même nom sous XWayland (GMS_WAYLAND=0).
    assign [app_id="^digitalmicrograph\.exe$"] 5
    assign [class="^digitalmicrograph\.exe$"] 5
