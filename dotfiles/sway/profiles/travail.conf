# Profil « travail » (inclus par ../config d'après scripts/profile.sh) : espace 5 libre, Discord-WhatsApp sur 6, Spotify sur 7,
# DigitalMicrograph sur 9. Mêmes règles que dotfiles/hypr/profiles/travail.lua. Pas de démarrage automatique.

# Espaces de Discord-WhatsApp et de Spotify (attributions dans ../config).
    set $ws_chat 6
    set $ws_music 7

# DigitalMicrograph (Wine, dépôt GMSFreeAnalysis17), relevé sur la VM : app_id « digitalmicrograph.exe » avec le pilote Wayland
# de Wine (défaut), classe X11 du même nom sous XWayland (GMS_WAYLAND=0).
    assign [app_id="^digitalmicrograph\.exe$"] 9
    assign [class="^digitalmicrograph\.exe$"] 9
