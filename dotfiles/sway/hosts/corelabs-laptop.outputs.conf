# Dalle interne identifiée par fabricant / modèle / série (EDID sans numéro de série → Unknown).
# Mode préféré conservé ; échelle 1, comme sous Hyprland.
set $panel "China Star Optoelectronics Technology Co., Ltd 0x1471 Unknown"
output $panel scale 1

# Capot fermé : dalle éteinte, rallumée à l'ouverture, état réappliqué au rechargement (état initial donné par libinput grâce
# au quirk dotfiles/libinput/hosts/). Veille : logind (docs/ARCHITECTURE.md § 7.13.1).
bindswitch --locked --reload lid:on output $panel disable
bindswitch --locked --reload lid:off output $panel enable
