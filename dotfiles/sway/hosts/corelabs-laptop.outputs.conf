# Dalle interne identifiée par fabricant / modèle / série (EDID sans numéro de série → Unknown).
# Mode préféré conservé ; échelle 1, comme sous Hyprland.
set $panel "China Star Optoelectronics Technology Co., Ltd 0x1471 Unknown"
output $panel scale 1

# Capot fermé : dalle éteinte, rallumée à l'ouverture. libinput ne donne pas l'état initial du capot (pas de quirk de
# fiabilité pour ce modèle) : relu au démarrage et à chaque rechargement. Veille : logind (docs/ARCHITECTURE.md § 7.13.1).
bindswitch --locked lid:on output $panel disable
bindswitch --locked lid:off output $panel enable
exec_always grep -q closed /proc/acpi/button/lid/LID0/state && swaymsg 'output $panel disable'
