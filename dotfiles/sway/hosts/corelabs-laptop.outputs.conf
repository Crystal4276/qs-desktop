# Dalle interne identifiée par fabricant / modèle / série (EDID sans numéro de série → Unknown).
# Mode préféré conservé ; échelle 1, comme sous Hyprland.
output "China Star Optoelectronics Technology Co., Ltd 0x1471 Unknown" scale 1

# Capot fermé : dalle éteinte, rallumée à l'ouverture (--reload : état réappliqué au rechargement). Veille : logind.
bindswitch --locked --reload lid:on output "China Star Optoelectronics Technology Co., Ltd 0x1471 Unknown" disable
bindswitch --locked --reload lid:off output "China Star Optoelectronics Technology Co., Ltd 0x1471 Unknown" enable
