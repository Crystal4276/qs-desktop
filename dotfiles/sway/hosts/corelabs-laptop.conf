# Machine « corelabs-laptop » (incluse selon le nom de machine).
# Écrans partagés avec l’écran de connexion (scripts/greeter.sh).
include corelabs-laptop.outputs.conf

# Windows 11 : console de virt-manager (domaine `win11` de hosts/corelabs-laptop.json), reconnue par son titre dès l'ouverture,
# toutes ses fenêtres ayant l'app_id virt-manager ; mosaïque, espace courant conservé. Le `move position center` de la règle
# flottante commune la ramène sur l'espace visible : renvoyée sur le sien après coup.
assign [app_id="^virt-manager$" title="^win11 on QEMU/KVM$"] workspace number $ws_windows
for_window [app_id="^virt-manager$" title="^win11 on QEMU/KVM$"] floating disable, move container to workspace number $ws_windows
