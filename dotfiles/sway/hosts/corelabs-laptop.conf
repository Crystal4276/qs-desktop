# Machine « corelabs-laptop » (incluse selon le nom de machine).
# Écrans partagés avec l’écran de connexion (scripts/greeter.sh).
include corelabs-laptop.outputs.conf

# Windows 11 : identité dédiée, placement avant le premier affichage.
assign [app_id="^qs-windows11$"] workspace number $ws_windows
for_window [app_id="^qs-windows11$"] floating disable
assign [class="^qs-windows11$"] workspace number $ws_windows
for_window [class="^qs-windows11$"] floating disable
