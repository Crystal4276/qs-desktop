# Machine « terrier » (inclus par ../config selon /etc/hostname). Écrans identifiés par description (marque modèle numéro de série),
# jamais par connecteur : un connecteur (DP-2…) peut changer de nom sur un dock ou un autre câble (docs/ARCHITECTURE.md § 3.1).
# Aucune attribution `workspace N output …` : la répartition des espaces est faite par Quickshell (services/Outputs.qml).

output "LG Electronics 27GN950 207NTLEFY824"   pos 0 0    mode 3840x2160@60.0Hz    scale 1.5 hdr off render_bit_depth 10
output "Dell Inc. Dell AW3418DW #ASPFPBQwWjbd" pos 2560 0 mode 3440x1440@100.000Hz
output "LG Electronics 27GN950 207NTHMFY841"   pos 6000 0 mode 3840x2160@60.0Hz    scale 1.5 hdr off render_bit_depth 10

# VRR (G-Sync) : désactivé comme avant. Bascule dans le panneau de réglages (non retenue au redémarrage).

# Fenêtres ouvertes sur les espaces 7 et 8 (écran de droite) renvoyées sur l'écran central, sauf Deluge et Thunderbird.
for_window [workspace="7" app_id="^(?!deluge).*$"] move to output "Dell Inc. Dell AW3418DW #ASPFPBQwWjbd"
for_window [workspace="8" app_id="^(?!org\.mozilla\.Thunderbird$).*$"] move to output "Dell Inc. Dell AW3418DW #ASPFPBQwWjbd"

# Matériel de cette machine
exec "modprobe sidewinder"
exec openrgb -p purple

# Partage du serveur de la maison
exec_always --no-startup-id bash -c "sleep 5 && gio mount ssh://<utilisateur>@<serveur>"
