# Réglages GSettings (dconf) du compte, appliqués par install.sh (scripts/dconf-keys.py apply, clé par clé) ; les autres
# préférences ne sont pas touchées. Anciennes valeurs gardées pour --uninstall. @HOME@ = dossier personnel.
# Couleurs, polices, thème : docs/THEME.md / config/Theme.qml (Catppuccin Mocha, accent green).
# Réglage propre à une machine : dotfiles/dconf/hosts/<machine>.ini, appliqué après celui-ci.

[org/gnome/desktop/interface]
gtk-theme='catppuccin-mocha-green-standard+default'
icon-theme='Papirus-Dark'
cursor-theme='catppuccin-mocha-green-cursors'
cursor-size=48
color-scheme='prefer-dark'
accent-color='green'
font-name='Inter Light 12'
document-font-name='Inter Light 13'
monospace-font-name='Source Code Pro 12'
clock-format='24h'
enable-hot-corners=false

[org/gnome/desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'

[org/gtk/settings/file-chooser]
show-hidden=true
show-size-column=true
show-type-column=true
sort-directories-first=false
location-mode='path-bar'

[org/nemo/preferences]
default-folder-viewer='icon-view'
show-hidden-files=false
show-location-entry=false
show-computer-icon-toolbar=false
show-home-icon-toolbar=false
show-new-folder-icon-toolbar=true
show-reload-icon-toolbar=true
show-show-thumbnails-toolbar=false
thumbnail-limit=uint64 68719476736

[io/github/celluloid-player/celluloid]
csd-enable=true
dark-theme-enable=true
mpv-config-enable=true
mpv-config-file='file://@HOME@/.config/mpv/mpv.conf'
mpv-input-config-enable=true
mpv-input-config-file='file://@HOME@/.config/mpv/input.conf'

# GNOME Terminal : un profil Catppuccin Mocha (palette ANSI officielle de catppuccin/gnome-terminal, valeurs de Theme.qml).
[org/gnome/terminal/legacy]
default-show-menubar=false
theme-variant='dark'

[org/gnome/terminal/legacy/profiles:]
default='3d20e2a5-02dc-435e-8c44-3d73ea5c7cca'
list=['3d20e2a5-02dc-435e-8c44-3d73ea5c7cca']

[org/gnome/terminal/legacy/profiles:/:3d20e2a5-02dc-435e-8c44-3d73ea5c7cca]
visible-name='Catppuccin Mocha'
use-theme-colors=false
background-color='#1e1e2e'
foreground-color='#cdd6f4'
bold-color-same-as-fg=true
bold-is-bright=false
cursor-colors-set=true
cursor-background-color='#f5e0dc'
cursor-foreground-color='#1e1e2e'
highlight-colors-set=false
palette=['#45475a', '#f38ba8', '#a6e3a1', '#f9e2af', '#89b4fa', '#f5c2e7', '#94e2d5', '#bac2de', '#585b70', '#f38ba8', '#a6e3a1', '#f9e2af', '#89b4fa', '#f5c2e7', '#94e2d5', '#a6adc8']
use-system-font=false
font='Monospace 16'
