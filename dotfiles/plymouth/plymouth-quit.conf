# /etc/systemd/system/plymouth-quit.service.d/qs-corelab.conf — installé par scripts/plymouth-setup.sh (docs/PLYMOUTH.md).
# Plymouth quitte après le lancement du greeter, une fois son compositeur maître de l'écran : quitter avant laisserait un
# écran noir (l'image disparaît avec plymouthd). --retain-splash : rien n'est redessiné en partant.
[Unit]
After=greetd.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'plymouth --ping || exit 0; sleep 5; plymouth quit --retain-splash'
