# /etc/systemd/system/plymouth-quit-wait.service.d/qs-corelab.conf — installé par scripts/plymouth-setup.sh (docs/PLYMOUTH.md).
# greetd démarre après plymouth-quit-wait.service. Au lieu d'attendre la fin de Plymouth : sortie du thème (fin du cycle en
# cours + 0,95 s, au plus 3,35 s), puis Plymouth désactivé en gardant son image crust à l'écran jusqu'au greeter.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'plymouth --ping || exit 0; plymouth update --status=qs-corelab-exit; sleep 3.4; plymouth deactivate'
