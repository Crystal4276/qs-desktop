# mpv / Celluloid : réglages communs. Lien ~/.config/mpv → dotfiles/mpv (install.sh).
# Le décodage matériel dépend de la carte graphique : host.conf, lien posé par install.sh vers hosts/<machine>.conf
# s'il existe, sinon vers hosts/default.conf.
include="~~/host.conf"

# Synchronisation
video-sync=display-resample
interpolation=no

# Cache normal
cache=auto

# Sous-titres
sub-auto=fuzzy
sub-font-size=55
sub-scale=1.2
