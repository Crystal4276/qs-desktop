# NVIDIA RTX 2080 — priorité à l'8K60 fluide

# Décodage matériel zéro-copie
hwdec=nvdec
hwdec-codecs=h264,hevc,vp8,vp9,mpeg2video,vc1
hwdec-software-fallback=no

# Sous Celluloid/libmpv, ne charger que l'interop utile
gpu-hwdec-interop=cuda

# Réduire la mémoire réservée autour du décodage
hwdec-extra-frames=0

# Éviter d'ajouter une file de décodage qui consommerait encore de la mémoire
vd-queue-enable=no

# Rendu le plus léger possible
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
deband=no
sigmoid-upscaling=no
dither-depth=no
