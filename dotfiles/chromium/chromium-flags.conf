# Options de lancement de Chromium (lues par le lanceur du paquet Arch : ~/.config/chromium-flags.conf).
# Machine sans réglage propre : aucune option ; Chromium choisit seul son décodage vidéo (VA-API sur Intel / AMD).
# Réglage d'une machine : dotfiles/chromium/hosts/<machine>.conf, lié à la place de ce fichier par install.sh.
# ATTENTION : Chromium ne garde que le DERNIER --enable-features ; tout regrouper sur une seule ligne.
