# Décodage vidéo matériel VA-API sur NVIDIA (RTX 2080, libva-nvidia-driver)
# Validé 2026-09-23 : H.264/VP9 → VaapiVideoDecoder. AV1 reste logiciel (Turing n'a pas de décodeur AV1).
# WaylandLinuxDrmSyncobj : explicit sync Wayland (déplacé depuis les bindings sway).
# ATTENTION : Chromium ne garde que le DERNIER --enable-features ; ne pas en repasser un en ligne de commande.
--enable-features=VaapiOnNvidiaGPUs,VaapiIgnoreDriverChecks,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL,WaylandLinuxDrmSyncobj
