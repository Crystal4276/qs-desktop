# Sway de l'écran de connexion (scripts/greeter.sh ajoute les écrans de la machine et le lancement de Quickshell). Le minimum :
# ni barre, ni fond (pas de swaybg), ni XWayland ; curseur et pavé numérique comme la session (dotfiles/sway/config).

xwayland disable
swaybg_command -
default_border none
seat seat0 xcursor_theme catppuccin-mocha-green-cursors 48
input * xkb_numlock enabled
