# /etc/greetd/config.toml — installé par scripts/greeter-setup.sh (sauvegarde de l'ancien : config.toml.bak-<date>).
# Écran de connexion Quickshell (docs/ARCHITECTURE.md § 9) : Sway minimal lancé par scripts/greeter.sh sous l'utilisateur `greeter`,
# depuis la copie système du dépôt. PAM : /etc/pam.d/greetd (sessions), /etc/pam.d/greetd-greeter (l'écran de connexion lui-même).

[terminal]
vt = 1

[default_session]
command = "/usr/local/share/qs-desktop/scripts/greeter.sh"
user = "greeter"
