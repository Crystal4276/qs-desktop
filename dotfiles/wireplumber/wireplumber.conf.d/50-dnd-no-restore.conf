# Pendant « ne pas déranger », Quickshell (services/Audio.qml) coupe les sons de notification des applications de
# `doNotDisturb.muteApps` (hosts/<machine>.json). WirePlumber retient volume et coupure par application : sans cette règle, la
# coupure de la nuit resterait le lendemain. Elle ne vise que leurs flux de lecture « Chromium », comme services/Audio.qml :
#  - web apps lancées avec `env PULSE_PROP_OVERRIDE=application.id=<nom>` (identifiant propre, séparé du navigateur ; un
#    programme lancé depuis la web app hérite de l'identifiant, pas du nom : son volume reste retenu) ;
#  - application Discord : flux « Chromium » de son binaire (ses appels, « WEBRTC VoiceEngine », gardent leur volume retenu).
stream.rules = [
  {
    matches = [
      { application.id = "discord", application.name = "Chromium", media.class = "Stream/Output/Audio" }
      { application.id = "whatsapp", application.name = "Chromium", media.class = "Stream/Output/Audio" }
      { application.process.binary = "Discord", application.name = "Chromium", media.class = "Stream/Output/Audio" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
