# Volume principal des flux de lecture gardé à 100 % (scripts/stream-full-volume.lua, installé par install.sh dans
# ~/.local/share/wireplumber/scripts/) : invisible dans Quickshell, pactl et wpctl, il peut rendre une application muette.
wireplumber.components = [
  { name = stream-full-volume.lua, type = script/lua, provides = custom.stream-full-volume }
]
wireplumber.profiles = {
  main = { custom.stream-full-volume = required }
}
