# Pendant « ne pas déranger », Quickshell (services/Audio.qml) coupe les sons de notification de Discord et des web apps
# Chromium. Leurs flux s'appellent « Chromium », comme ceux du navigateur, et WirePlumber retient volume et coupure par nom
# d'application : sans cette règle, une coupure de WhatsApp se reporterait sur YouTube. Ces flux démarrent donc toujours à
# 100 %, non coupés.
stream.rules = [
  {
    matches = [
      { application.name = "Chromium" }
      { application.process.binary = "Discord" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
