# Pendant « ne pas déranger », Quickshell (services/Audio.qml) coupe les sons de notification de Discord et des web apps
# Chromium. Leurs flux de lecture (pas les micros) s'appellent « Chromium », comme ceux du navigateur, et WirePlumber retient volume et coupure par nom
# d'application : sans cette règle, une coupure de WhatsApp se reporterait sur YouTube. Ces flux ne reprennent donc ni
# volume ni coupure retenus.
stream.rules = [
  {
    matches = [
      { application.name = "Chromium", media.class = "Stream/Output/Audio" }
      { application.process.binary = "Discord", media.class = "Stream/Output/Audio" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
